# Manual measurement requires separate user approval of the exact committed policy
# hash and batch. This file records that approval; it does not grant it.
# Job dependencies serialize all four runners. A completed protocol is not a target
# pass: the lead reviews result.json branches and the tier100 freeze after the run.
# GitHub supports the step-list anchor used below; no merge keys are used.
name: Storage contract checks
on:
  push:
    branches:
    - study/storage-harness
    paths:
    - study/storage/checks/**
    - study/storage/harness/**
    - .github/workflows/storage-checks.yml
  workflow_dispatch:
    inputs:
      approval_id:
        description: Public artifact record of exact-policy batch approval. Never enter secrets or private notes.
        required: true
        type: string
      release_tag:
        description: Fixed public fixture release tag; never latest
        required: true
        type: string
      fork_commit:
        description: Full reviewed fork commit; must equal the selected workflow ref commit
        required: true
        type: string
      policy_sha256:
        description: Approved SHA-256 of study/storage/checks/run-policy.json at that commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: storage-checks
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
  GOENV: 'off'
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  CGO_ENABLED: '0'
  GOOS: linux
  GOARCH: amd64
  PYTHONDONTWRITEBYTECODE: '1'
  LANG: C.UTF-8
jobs:
  tests:
    if: github.repository == 'peterkc/gortex'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      timeouts: ${{ steps.preflight.outputs.timeouts }}
    steps:
    - name: Set the job work directory from the runner temp path
      shell: bash
      run: echo "WORK=$RUNNER_TEMP/storage-checks-tests" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Check policy, source, approval inputs and refusal cases
      id: preflight
      env:
        REQUEST_APPROVAL: ${{ inputs.approval_id }}
        REQUEST_RELEASE: ${{ inputs.release_tag }}
        REQUEST_COMMIT: ${{ inputs.fork_commit }}
        REQUEST_POLICY: ${{ inputs.policy_sha256 }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$WORK"
        python3.12 -B -c '
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import subprocess
        import unittest


        def unique_object(pairs):
            result = {}
            for key, value in pairs:
                if key in result:
                    raise RuntimeError("duplicate policy key: " + key)
                result[key] = value
            return result


        def admit_dispatch(request, *, source, actual, policy_pin, attempt):
            if source != actual:
                raise RuntimeError("checkout differs from the workflow commit")
            if request["event"] != "workflow_dispatch":
                return
            if attempt != "1":
                raise RuntimeError("no rerun: obtain approval and dispatch afresh")
            if not request["approval_id"].strip():
                raise RuntimeError("recorded exact-batch approval ID is required")
            if not re.fullmatch(r"[0-9a-f]{40}", request["fork_commit"]):
                raise RuntimeError("fork_commit must be a full lowercase commit")
            if request["fork_commit"] != actual:
                raise RuntimeError("select the reviewed workflow commit for dispatch")
            if not re.fullmatch(r"[0-9a-f]{64}", request["policy_sha256"]):
                raise RuntimeError("policy_sha256 must be a full lowercase SHA-256")
            if request["policy_sha256"] != policy_pin:
                raise RuntimeError("policy hash differs; obtain exact-value approval")
            tag = request["release_tag"]
            if (not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", tag)
                    or tag == "latest"):
                raise RuntimeError("explicit fixed public fixture release required")


        class AdmissionTests(unittest.TestCase):
            def test_exact_and_push(self):
                admit_dispatch(self.request(), source="a" * 40, actual="a" * 40,
                               policy_pin="b" * 64, attempt="1")
                admit_dispatch({"event": "push"}, source="a" * 40,
                               actual="a" * 40, policy_pin="b" * 64, attempt="2")

            def request(self):
                return {"event": "workflow_dispatch", "approval_id": "batch-record",
                        "fork_commit": "a" * 40, "policy_sha256": "b" * 64,
                        "release_tag": "storage-fixtures-v1"}

            def test_refusal_before_execution(self):
                cases = (("approval_id", ""), ("approval_id", "  "),
                         ("fork_commit", "a" * 39),
                         ("fork_commit", "c" * 40),
                         ("policy_sha256", "b" * 63),
                         ("policy_sha256", "c" * 64),
                         ("release_tag", "latest"), ("release_tag", "../other"))
                for field, value in cases:
                    with self.subTest(field=field, value=value):
                        request = {**self.request(), field: value}
                        with self.assertRaises(RuntimeError):
                            admit_dispatch(request, source="a" * 40,
                                           actual="a" * 40, policy_pin="b" * 64,
                                           attempt="1")
                for actual, attempt in (("c" * 40, "1"), ("a" * 40, "2")):
                    with self.assertRaises(RuntimeError):
                        admit_dispatch(self.request(), source="a" * 40,
                                       actual=actual, policy_pin="b" * 64,
                                       attempt=attempt)

            def test_duplicate_policy_key(self):
                with self.assertRaises(RuntimeError):
                    unique_object([("wall_seconds", 1), ("wall_seconds", 2)])


        suite = unittest.defaultTestLoader.loadTestsFromTestCase(AdmissionTests)
        if not unittest.TextTestRunner(verbosity=2).run(suite).wasSuccessful():
            raise RuntimeError("workflow admission self-tests failed")
        policy_path = Path("study/storage/checks/run-policy.json")
        raw = policy_path.read_bytes()
        policy_pin = hashlib.sha256(raw).hexdigest()
        policy = json.loads(raw, object_pairs_hook=unique_object)
        if policy["schema"] != "design-c-checks-run-policy/v1":
            raise RuntimeError("unsupported committed policy schema")
        if policy["contract"]["construction_selection_approved"] is not True:
            raise RuntimeError("the approved D29 construction selection must be true")
        actual = subprocess.check_output(["git", "rev-parse", "HEAD"],
                                         text=True).strip()
        request = {"event": os.environ["GITHUB_EVENT_NAME"],
                   "approval_id": os.environ["REQUEST_APPROVAL"],
                   "fork_commit": os.environ["REQUEST_COMMIT"],
                   "policy_sha256": os.environ["REQUEST_POLICY"],
                   "release_tag": os.environ["REQUEST_RELEASE"]}
        admit_dispatch(request, source=os.environ["GITHUB_SHA"], actual=actual,
                       policy_pin=policy_pin, attempt=os.environ["GITHUB_RUN_ATTEMPT"])
        if (policy["jobs"]["tests"]["timeout_minutes"] != 45
                or policy["venue"]["runner"] != "ubuntu-24.04"
                or policy["venue"]["max_parallel"] != 1
                or policy["venue"]["price_cap_usd"] != 0):
            raise RuntimeError("workflow literals or zero-cost serial venue differ")
        timeouts = {}
        for role in ("base", "linkdelta", "vector"):
            minutes = policy["jobs"][role]["timeout_minutes"]
            if type(minutes) is not int or not 0 < minutes <= 360:
                raise RuntimeError("positive job timeout at most 360 minutes required")
            timeouts[role] = minutes
        base_seconds = (policy["fetch"]["wall_seconds"]
                        + policy["tiny"]["wall_seconds"]
                        + policy["tier100"]["wall_seconds"]
                        + policy["base"]["wall_seconds"])
        link_seconds = (policy["fetch"]["wall_seconds"]
                        + len(policy["linkdelta"]["tiers"])
                        * policy["linkdelta"]["wall_seconds"])
        vector_seconds = (policy["vector"]["generate_wall_seconds"]
                          + policy["vector"]["wall_seconds"])
        for role, seconds in (("base", base_seconds), ("linkdelta", link_seconds),
                              ("vector", vector_seconds)):
            job = policy["jobs"][role]
            required = seconds + job["setup_seconds"] + job["cleanup_upload_seconds"]
            if required > job["timeout_minutes"] * 60:
                raise RuntimeError("job budget omits a phase or its reserve: " + role)
        with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
            output.write("timeouts="
                         + json.dumps(timeouts, separators=(",", ":")) + "\n")
        evidence = Path(os.environ["WORK"])
        (evidence / "policy.json").write_bytes(raw)
        (evidence / "admission.json").write_text(json.dumps({
            "source_revision": actual, "policy_sha256": policy_pin,
            "request": request, "run_id": os.environ["GITHUB_RUN_ID"],
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "actor": os.environ["GITHUB_ACTOR"], "job_timeouts": timeouts,
        }, indent=2) + "\n")
        ' 2>&1 | tee "$WORK/preflight.log"
    - name: Use the reviewed Go toolchain
      id: toolchain
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: false
    - name: Isolate Go build state outside the checkout
      id: isolation
      shell: bash
      run: |
        set -euo pipefail
        python3.12 -B -c '
        import os
        from pathlib import Path

        cache = Path(os.environ["RUNNER_TEMP"]) / "checks-test-cache"
        folders = {"GOCACHE": "build", "GOMODCACHE": "mod", "GOPATH": "gopath",
                   "HOME": "home", "TMPDIR": "tmp", "XDG_CONFIG_HOME": "config",
                   "XDG_CACHE_HOME": "cache", "XDG_DATA_HOME": "data",
                   "XDG_STATE_HOME": "state", "XDG_RUNTIME_DIR": "runtime"}
        with Path(os.environ["GITHUB_ENV"]).open("a") as output:
            for key, folder in folders.items():
                directory = cache / folder
                directory.mkdir(parents=True, mode=0o700)
                output.write(key + "=" + str(directory) + "\n")
        '
        go version | tee "$WORK/go-version.txt"
    - name: base vet
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        go -C study/storage/checks/base vet -p=1 ./... 2>&1 \
          | tee "$WORK/base-vet.log"
    - name: base test
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        go -C study/storage/checks/base test -p=1 -v ./... 2>&1 \
          | tee "$WORK/base-test.log"
    - name: linkdelta vet
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        go -C study/storage/checks/linkdelta vet -p=1 ./... 2>&1 \
          | tee "$WORK/linkdelta-vet.log"
    - name: linkdelta test
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        go -C study/storage/checks/linkdelta test -p=1 -v ./... 2>&1 \
          | tee "$WORK/linkdelta-test.log"
    - name: vector vet
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        go -C study/storage/checks/vector vet -p=1 ./... 2>&1 \
          | tee "$WORK/vector-vet.log"
    - name: vector test
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        go -C study/storage/checks/vector test -p=1 -v ./... 2>&1 \
          | tee "$WORK/vector-test.log"
    - name: base Python unit tests
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      working-directory: study/storage/checks/base
      shell: bash
      run: |
        set -euo pipefail
        python3.12 -B -m unittest -v test_measure 2>&1 \
          | tee "$WORK/base-python.log"
    - name: fixtures Python unit tests
      if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.isolation.outcome == 'success' }}
      working-directory: study/storage/checks/fixtures
      shell: bash
      run: |
        set -euo pipefail
        python3.12 -B -m unittest -v test_fetch 2>&1 \
          | tee "$WORK/fixtures-python.log"
    - name: Upload unit and admission evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: storage-checks-tests-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/storage-checks-tests/
        if-no-files-found: error
  base:
    name: 'Checks 1, 2 and 5: same-host A/B/C base comparison'
    needs:
    - tests
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'peterkc/gortex' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.tests.outputs.timeouts).base }}
    env:
      CHECK_GROUP: base
    outputs:
      freeze_uploaded: ${{ steps.freeze_upload.outcome }}
    steps: &measurement_steps
    - name: Set the job work directory from the runner temp path
      shell: bash
      run: echo "WORK=$RUNNER_TEMP/storage-checks" >> "$GITHUB_ENV"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Bind the approved batch and actual host before any target
      env:
        REQUEST_APPROVAL: ${{ inputs.approval_id }}
        REQUEST_RELEASE: ${{ inputs.release_tag }}
        REQUEST_COMMIT: ${{ inputs.fork_commit }}
        REQUEST_POLICY: ${{ inputs.policy_sha256 }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$WORK"
        printf '%s\n' 'phase=start' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
        python3.12 -B -c '
        import hashlib
        import json
        import os
        from pathlib import Path
        import platform
        import shutil
        import socket
        import subprocess
        import sys

        raw = Path("study/storage/checks/run-policy.json").read_bytes()
        pin = hashlib.sha256(raw).hexdigest()
        actual = subprocess.check_output(["git", "rev-parse", "HEAD"],
                                         text=True).strip()
        if (os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
                or os.environ["GITHUB_RUN_ATTEMPT"] != "1"
                or not os.environ["REQUEST_APPROVAL"].strip()
                or pin != os.environ["REQUEST_POLICY"]
                or actual != os.environ["REQUEST_COMMIT"]
                or actual != os.environ["GITHUB_SHA"]):
            raise RuntimeError("manual approval, source or committed policy drift")
        if subprocess.check_output(["git", "status", "--porcelain"]):
            raise RuntimeError("measurement checkout is dirty")
        policy = json.loads(raw)
        role = os.environ["CHECK_GROUP"]
        if role not in ("base", "linkdelta", "vector"):
            raise RuntimeError("unknown measurement group")
        if platform.system() != "Linux" or sys.version_info < (3, 12):
            raise RuntimeError("Linux with Python 3.12+ required")
        venue = policy["venue"]
        cpu_count = os.cpu_count()
        mem = dict(line.split(":", 1) for line in
                   Path("/proc/meminfo").read_text().splitlines())
        physical_bytes = int(mem["MemTotal"].split()[0]) * 1024
        print(json.dumps({"actual_cpu_count": cpu_count,
                          "physical_memory_bytes": physical_bytes,
                          "approved_venue": venue}), flush=True)
        if cpu_count != venue["cpus"]:
            raise RuntimeError("actual CPU count differs from the approved venue")
        if physical_bytes < venue["job_memory_bytes"] + venue["host_reserve_bytes"]:
            raise RuntimeError("host cannot supply the cap and outside-owner reserve")
        event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
        if event["repository"]["private"] or venue["price_cap_usd"] != 0:
            raise RuntimeError("only the zero-cost public-fork venue is approved")
        if role in ("base", "linkdelta") and shutil.which("zstd") is None:
            raise RuntimeError("the strict public fixture fetch requires zstd")
        work = Path(os.environ["WORK"])
        for name in ("evidence", "bin", "preparation", "inputs", "results"):
            (work / name).mkdir()
        (work / "evidence/policy.json").write_bytes(raw)
        record = {
            "schema": "design-c-checks-operator-record/v1",
            "approval_id": os.environ["REQUEST_APPROVAL"],
            "authority": "Separate user approval of this exact batch is required; "
                         "a nonempty identifier does not grant approval.",
            "source_revision": actual, "policy_sha256": pin,
            "contract": policy["contract"], "group": role,
            "release_tag": os.environ["REQUEST_RELEASE"],
            "host": socket.gethostname(), "operator": os.environ["GITHUB_ACTOR"],
            "run_id": os.environ["GITHUB_RUN_ID"],
            "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
            "run_url": "https://github.com/" + os.environ["GITHUB_REPOSITORY"]
                       + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
            "venue": venue, "actual_cpu_count": cpu_count,
            "physical_memory_bytes": physical_bytes,
            "disk_at_admission": shutil.disk_usage(work)._asdict(),
            "platform": platform.platform(),
            "python": sys.version,
        }
        (work / "evidence/operator.json").write_text(
            json.dumps(record, indent=2, allow_nan=False) + "\n")
        cache = Path(os.environ["RUNNER_TEMP"]) / "checks-cache"
        folders = {"GOCACHE": "build", "GOMODCACHE": "mod", "GOPATH": "gopath",
                   "HOME": "home", "TMPDIR": "tmp", "XDG_CONFIG_HOME": "config",
                   "XDG_CACHE_HOME": "cache", "XDG_DATA_HOME": "data",
                   "XDG_STATE_HOME": "state", "XDG_RUNTIME_DIR": "runtime"}
        with Path(os.environ["GITHUB_ENV"]).open("a") as output:
            output.write("CHECKOUT_REVISION=" + actual + "\n")
            output.write("GX_CHECKS_JOB_BYTES="
                         + str(venue["job_memory_bytes"]) + "\n")
            for key, folder in folders.items():
                directory = cache / folder
                directory.mkdir(parents=True, mode=0o700)
                output.write(key + "=" + str(directory) + "\n")
        ' 2>&1 | tee "$WORK/preflight.log"
      id: admission
    - name: Record disk after admission
      if: ${{ always() && steps.admission.outcome != 'skipped' }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'phase=after-admission' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
    - name: Use the reviewed Go toolchain
      id: toolchain
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.27.1
        cache: false
    - name: Record disk after toolchain
      if: ${{ always() && steps.toolchain.outcome != 'skipped' }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'phase=after-toolchain' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
    - name: Free unused preinstalled software on the disposable VM only
      id: software_cleanup
      if: ${{ env.CHECK_GROUP == 'base' || env.CHECK_GROUP == 'linkdelta' }}
      shell: bash
      run: |
        set -euo pipefail
        # Destructive only on this disposable hosted VM. Never remove job evidence.
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        printf '%s\n' 'phase=before-software-cleanup' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
        python3.12 -B -c '
        import os
        from pathlib import Path

        protected = [Path(os.environ[key]).resolve() for key in
                     ("GITHUB_WORKSPACE", "RUNNER_TEMP", "WORK", "HOME",
                      "GOCACHE", "GOMODCACHE", "GOPATH")]
        for name in ("/usr/share/dotnet", "/usr/local/lib/android", "/opt/ghc",
                     "/opt/hostedtoolcache/CodeQL"):
            target = Path(name).resolve()
            if any(target.is_relative_to(root) or root.is_relative_to(target)
                   for root in protected):
                raise RuntimeError(
                    "refuse software cleanup overlapping protected state")
        '
        sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL
        printf '%s\n' 'phase=after-software-cleanup' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
    - name: Record disk after software cleanup
      if: ${{ always() && steps.software_cleanup.outcome != 'skipped' }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'phase=after-software-cleanup-terminal' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
    - name: Delegate one bounded job tree; keep the cleanup owner outside
      shell: bash
      run: |
        set -euo pipefail
        root="/sys/fs/cgroup/gxchecks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${CHECK_GROUP}"
        test -f /sys/fs/cgroup/cgroup.controllers
        echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control
        sudo mkdir "$root"
        stat -c '%d %i' "$root" > "$WORK/evidence/cgroup-root.identity"
        echo "GX_CHECKS_CGROUP_ROOT=$root" >> "$GITHUB_ENV"
        printf '%s\n' "$GX_CHECKS_JOB_BYTES" | sudo tee "$root/memory.max"
        echo 0 | sudo tee "$root/memory.swap.max"
        echo 1 | sudo tee "$root/memory.oom.group"
        echo +memory | sudo tee "$root/cgroup.subtree_control"
        sudo mkdir "$root/driver"
        sudo chown -R "$(id -u):$(id -g)" "$root"
      id: delegate
    - name: Record disk after delegate
      if: ${{ always() && steps.delegate.outcome != 'skipped' }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'phase=after-delegate' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
    - name: Build only this group outside measurement timing
      shell: bash
      run: |2

        set -euo pipefail
        printf '%s\n' "$$" | sudo tee "$GX_CHECKS_CGROUP_ROOT/driver/cgroup.procs" > /dev/null
        expected="${GX_CHECKS_CGROUP_ROOT#/sys/fs/cgroup}/driver"
        grep -Fx "0::$expected" "/proc/$$/cgroup" | tee "$WORK/evidence/driver-build.txt"
        go version | tee "$WORK/evidence/go-version.txt"
        go -C study/storage/harness build -p=1 -trimpath \
          -o "$WORK/bin/limited-command" ./cmd/limited-command 2>&1 | tee "$WORK/evidence/build-launcher.log"
        case "$CHECK_GROUP" in
          base)
            go -C study/storage/harness build -p=1 -trimpath \
              -o "$WORK/bin/gen" ./cmd/gen 2>&1 | tee "$WORK/evidence/build-gen.log"
            go -C study/storage/adapters/sqlite-segment build -p=1 -trimpath \
              -o "$WORK/bin/sqlite-segment" . 2>&1 | tee "$WORK/evidence/build-a.log"
            go -C study/storage/adapters/pebble-bleve build -p=1 -trimpath \
              -o "$WORK/bin/pebble-bleve" . 2>&1 | tee "$WORK/evidence/build-b.log"
            go -C study/storage/checks/base build -p=1 -trimpath \
              -o "$WORK/bin/parquet-base" ./cmd/parquet 2>&1 | tee "$WORK/evidence/build-c.log"
            go -C study/storage/checks/base build -p=1 -trimpath \
              -o "$WORK/bin/parquet-side" ./cmd/side 2>&1 | tee "$WORK/evidence/build-c-side.log"
            go -C study/storage/checks/base build -p=1 -trimpath \
              -o "$WORK/bin/base-fixture" ./cmd/fixture 2>&1 | tee "$WORK/evidence/build-tiny.log"
            ;;
          linkdelta)
            go -C study/storage/checks/linkdelta build -p=1 -trimpath \
              -o "$WORK/bin/linkdelta" . 2>&1 | tee "$WORK/evidence/build-linkdelta.log"
            ;;
          vector)
