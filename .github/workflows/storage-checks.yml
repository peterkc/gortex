            phase = work / "preparation" / name
            phase.mkdir()
            write_json(phase / "input.json", request)
            deadline = datetime.now(timezone.utc) + timedelta(
                seconds=spec["wall_seconds"])
            write_json(phase / "policy.json", {
                "schema": "external-limits/v1", "deadline": deadline.isoformat(),
            })
            write_json(phase / "binding.json", {
                "source_revision": request["source_revision"],
                "harness_sha256": sha256(launcher),
                "data_sha256": sha256(phase / "input.json"),
                "recipe_sha256": sha256(phase / "policy.json"),
                "host": request["host"], "command": command,
                "memory_limits_bytes": spec["memory_limits_bytes"],
            })
            argv = [str(launcher), "-binding", str(phase / "binding.json"),
                    "-binding-pin", sha256(phase / "binding.json"),
                    "-policy", str(phase / "policy.json"),
                    "-data", str(phase / "input.json"), "-cgroup-root", cgroup,
                    "-out", str(phase / "limited"), "--", *command]
            write_json(phase / "command.json", {"argv": argv})
            completed = subprocess.run(argv, check=False)
            receipt = json.loads((phase / "limited/receipt.json").read_text())
            if (completed.returncode != 0 or receipt["state"] != "completed"
                    or receipt["removed"] is not True):
                raise RuntimeError(name + " did not complete and remove its scope")
            return sha256(phase / "limited/receipt.json")


