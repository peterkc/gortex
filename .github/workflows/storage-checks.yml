      id: cleanup
    - name: Record disk after cleanup
      if: ${{ always() && steps.cleanup.outcome != 'skipped' }}
      shell: bash
      run: |
        set -euo pipefail
        printf '%s\n' 'phase=after-cleanup' | tee -a "$WORK/df.log"
        df -B1 "$GITHUB_WORKSPACE" "$RUNNER_TEMP" 2>&1 | tee -a "$WORK/df.log"
    - name: Upload every receipt, result and diagnostic log, including failures
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: storage-checks-${{ env.CHECK_GROUP }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/storage-checks/preflight.log
          ${{ runner.temp }}/storage-checks/evidence/**
          ${{ runner.temp }}/storage-checks/preparation/**/*.json
          ${{ runner.temp }}/storage-checks/preparation/**/command.log
          ${{ runner.temp }}/storage-checks/results/**/*.json
          ${{ runner.temp }}/storage-checks/results/**/*.json.partial
          ${{ runner.temp }}/storage-checks/results/**/*.jsonl
          ${{ runner.temp }}/storage-checks/results/*.log
          ${{ runner.temp }}/storage-checks/results/**/command.log
          ${{ runner.temp }}/storage-checks/results/**/runner-*.log*
          ${{ runner.temp }}/storage-checks/results/**/engine-*.log*
          ${{ runner.temp }}/storage-checks/results/**/checker-*.log*
          ${{ runner.temp }}/storage-checks/df.log
        if-no-files-found: error
  linkdelta:
    name: 'Checks 3 and 4: unchanged tiers, serial link/delta comparison'
    needs:
    - tests
    - base
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.tests.result == 'success' && needs.base.outputs.freeze_uploaded == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.tests.outputs.timeouts).linkdelta }}
    env:
      CHECK_GROUP: linkdelta
    steps: *measurement_steps
  vector:
    name: 'Check 6: D28 synthetic-only vector scan'
    needs:
    - tests
    - base
    - linkdelta
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.tests.result == 'success' && needs.base.outputs.freeze_uploaded == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.tests.outputs.timeouts).vector }}
    env:
      CHECK_GROUP: vector
    steps: *measurement_steps
