            raw = (directory / "manifest.json").read_bytes()
            manifest = json.loads(raw)
            if (manifest["generator_version"] != "gxstudy-v2"
                    or len(manifest["repos"]) != expected_count
                    or len(set(manifest["repos"])) != expected_count
                    or manifest.get("cross_repo_policy")):
                raise RuntimeError("generated tier identity differs from the recipe")
