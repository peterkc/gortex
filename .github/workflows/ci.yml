name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per PR: a new push cancels the PR's older run. Every other event
# (pushes to main, schedules) gets its own group from the run ID, so none of
# those runs is ever cancelled or replaced while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test-partition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest scripts/test_ci_test_partition.py

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      platform: ${{ steps.plan.outputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-timings/
          key: ci-timings-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ci-timings-
      - name: Plan time-balanced partitions
        id: plan
        run: python3 scripts/ci-test-partition.py --plan --event ${{ github.event_name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-used
          path: ci-timings/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  test:
    name: test (${{ matrix.os }}, ${{ matrix.go-version }}, ${{ matrix.partition }})
    needs: plan
    env:
      TEST_OS: ${{ matrix.os }}
      TEST_PARTITION: ${{ matrix.partition }}
      TEST_SHARD_COUNT: ${{ matrix.shard_count }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-timings-used
          path: ci-timings/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Go cache paths
        id: cache-paths
        shell: bash
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache-paths.outputs.build }}
            ${{ steps.cache-paths.outputs.mod }}
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-race-${{ runner.os }}-

      - name: Build
        run: go build -o gortex ./cmd/gortex/

      - name: Test
        id: test
        shell: bash
        env:
          TEST_RACE: ${{ matrix.race }}
          SAVE_TIMINGS: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        run: |
          if [[ "$SAVE_TIMINGS" == true && "$TEST_SHARD_COUNT" != 0 ]]; then
            python3 scripts/ci-test-partition.py 2>&1 | tee test-output.log
          else
            python3 scripts/ci-test-partition.py
          fi

      - name: Warm race cache for sharded packages
        if: ${{ !cancelled() && matrix.partition == 'remaining' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        run: |
          # The census builds without coverage; the shard tests build with it.
          mkdir -p "$RUNNER_TEMP/race-warm" "$RUNNER_TEMP/race-warm-cover"
          go test -race -c -o "$RUNNER_TEMP/race-warm/" ./internal/graph/store_sqlite ./internal/indexer ./internal/mcp
          go test -race -cover -c -o "$RUNNER_TEMP/race-warm-cover/" ./internal/graph/store_sqlite ./internal/indexer ./internal/mcp

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && matrix.partition == 'remaining' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        with:
          path: |
            ${{ steps.cache-paths.outputs.build }}
            ${{ steps.cache-paths.outputs.mod }}
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
        continue-on-error: true

      - name: Write shard timings
        if: ${{ steps.test.outcome == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.shard_count > 0 }}
        shell: bash
        run: python3 scripts/ci-test-partition.py --write-timings test-output.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.test.outcome == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.shard_count > 0 }}
        with:
          name: ci-timings-${{ matrix.os }}-${{ matrix.partition }}
          path: ci-shard-timings/*.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  test-platform:
    name: test-platform (${{ matrix.os }}, ${{ matrix.go-version }}, ${{ matrix.partition }})
    needs: plan
    env:
      TEST_OS: ${{ matrix.os }}
      TEST_PARTITION: ${{ matrix.partition }}
      TEST_SHARD_COUNT: ${{ matrix.shard_count }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platform) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-timings-used
          path: ci-timings/

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o gortex ./cmd/gortex/

      # Per-run plain timings require Windows -v output.
      - name: Test
        id: test
        shell: bash
        env:
          TEST_RACE: "false"
          SAVE_TIMINGS: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
          TEST_WINDOWS: ${{ matrix.os == 'windows-latest' }}
        run: |
          run_tests() {
            if [[ "$TEST_WINDOWS" == true ]]; then
              python - <<'PY_WINDOWS_TESTS'
          import os
          from pathlib import Path
          import subprocess
          import sys

          scratch = Path(os.environ["RUNNER_TEMP"]) / "gortex-storage-tests"
          scratch.mkdir(parents=True, exist_ok=True)
          os.environ["GOTMPDIR"] = str(scratch)
          print("Windows test GOTMPDIR:", scratch, flush=True)
          sys.exit(subprocess.call([sys.executable, "scripts/ci-test-partition.py"]))
          PY_WINDOWS_TESTS
            else
              python3 scripts/ci-test-partition.py
            fi
          }
          if [[ "$SAVE_TIMINGS" == true && "$TEST_WINDOWS" == true && "$TEST_SHARD_COUNT" != 0 ]]; then
            run_tests 2>&1 | tee test-output.log
          else
            run_tests
          fi

      - name: Write shard timings
        if: ${{ steps.test.outcome == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.shard_count > 0 && matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/ci-test-partition.py --write-timings test-output.log
          else
            python3 scripts/ci-test-partition.py --write-timings test-output.log
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.test.outcome == 'success' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && matrix.shard_count > 0 && matrix.os == 'windows-latest' }}
        with:
          name: ci-timings-${{ matrix.os }}-${{ matrix.partition }}
          path: ci-shard-timings/*.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 7

  timings:
    needs: [plan, test, test-platform]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-timings-used
          path: ci-timings/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-timings-*-*
          merge-multiple: true
          path: ci-shard-timings/
      - name: Merge measured timings
        run: python3 scripts/ci-test-partition.py --merge-timings
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-timings/
          key: ci-timings-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timings-merged
          overwrite: true
          retention-days: 30
          # Copy these files into scripts/ to update the committed fallback.
          path: |
            ci-timings/ci-race-timings.json
            ci-timings/ci-plain-timings.json

  build-linux-static:
    # The linux release ships a statically linked binary so it runs on any
    # distro (see .goreleaser.yml). That only holds while the code stays
    # link-clean under -static + netgo/osusergo — a new cgo dependency, or a
    # dep that needs a runtime dlopen, breaks it. The release-time build hook
    # catches that at tag time; this catches it on the PR that introduces it.
    #
    # ubuntu-latest is the same Ubuntu 24.04 / GCC 13 generation as the
    # goreleaser-cross image, so it reproduces the same GLIBCXX floor the
    # dynamic build used to inherit — without pulling that multi-GB image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build with the release link flags
        env:
          CGO_ENABLED: "1"
        run: |
          go build -tags netgo,osusergo,static_link \
            -ldflags '-s -w -extldflags "-static"' \
            -o gortex-static ./cmd/gortex/

      - name: Verify the binary is self-contained
        run: |
          file gortex-static
          sh scripts/verify-static-elf.sh gortex-static

      # The static-only code path (custom grammars declining instead of
      # dlopen'ing) is compiled out of every other job, so it needs its tests
      # run under the tag or they never execute anywhere.
      - name: Test the static-only code paths
        run: go test -count=1 -tags netgo,osusergo,static_link ./internal/parser/languages/

      - name: Run it where the dynamic build could not
        # debian:11 (glibc 2.31 / GLIBCXX_3.4.28) is the userland that reported
        # `GLIBCXX_3.4.32 not found`; alpine has no glibc at all. Exercise a
        # command that resolves the user's home dir and touches the net stack,
        # so a missing netgo/osusergo tag fails here rather than for a user.
        run: |
          set -euo pipefail
          for img in debian:11 alpine:3; do
            echo "== $img"
            docker run --rm -v "$PWD/gortex-static:/gortex:ro" "$img" /gortex version
            docker run --rm -v "$PWD/gortex-static:/gortex:ro" "$img" /gortex daemon status || true
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --timeout=10m

      # goreleaser used to run `go mod tidy` as a release before-hook, which
      # meant an untidy go.mod was silently rewritten inside the release
      # container — the shipped binaries could be built against a module set
      # no CI job had ever compiled. That hook is gone; tidiness is asserted
      # here instead, on the PR that introduces the drift, and it FAILS rather
      # than rewrites.
      - name: go.mod is tidy
        run: |
          set -euo pipefail
          go mod tidy
          if ! git diff --exit-code --stat go.mod go.sum; then
            echo "FATAL: go.mod/go.sum are not tidy — run \`go mod tidy\` and commit the result" >&2
            exit 1
          fi

  build-onnx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install ONNX Runtime
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.24.4/onnxruntime-linux-x64-1.24.4.tgz
          tar xzf onnxruntime-linux-x64-1.24.4.tgz
          sudo cp onnxruntime-linux-x64-1.24.4/lib/libonnxruntime.so* /usr/local/lib/
          sudo ldconfig

      - name: Build with ONNX tag
        run: go build -tags embeddings_onnx -o gortex-onnx ./cmd/gortex/

      - name: Build default (Hugot bundled — no tag)
        run: go build -o gortex-default ./cmd/gortex/

      - name: Install rust tokenizers library
        # hugot's XLA session uses the rust tokenizer, statically linked as
        # -ltokenizers, so the embeddings_gomlx XLA build needs libtokenizers.a
        # on the linker path. (The pure-Go default and the ONNX build do not.)
        run: |
          curl -fsSL https://github.com/daulet/tokenizers/releases/download/v1.27.0/libtokenizers.linux-amd64.tar.gz | tar -xz
          sudo cp libtokenizers.a /usr/lib/
          sudo cp libtokenizers.a /usr/local/lib/

      - name: Build with GoMLX + XLA tags
        run: go build -tags "embeddings_gomlx XLA" -o gortex-gomlx ./cmd/gortex/

      - name: Build with GoMLX tag only (compat — some docs/scripts still pass it alone)
        run: go build -tags embeddings_gomlx -o gortex-gomlx-noxla ./cmd/gortex/

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        run: go test -run '^$' -bench=. -benchmem -count=1 -benchtime=1x -timeout=20m ./internal/parser/languages/ ./internal/query/ ./internal/graph/
