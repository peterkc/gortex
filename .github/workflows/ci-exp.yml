name: CI experiment (fork only)

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Per-test times with and without -race, to see where race time goes.
  pertest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        partition: [indexer-2, mcp]
        flags: ['-race', '']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Select the tests (same names as the #806 shard)
        env:
          TEST_PARTITION: ${{ matrix.partition }}
        run: |
          python3 scripts/ci-test-partition.py --dry-run --manifest sel.json
          if [ "$TEST_PARTITION" = mcp ]; then
            echo . > pattern.txt
          else
            idx="${TEST_PARTITION##*-}"
            jq -r --argjson i "$idx" '.patterns[$i]' sel.json > pattern.txt
          fi
          jq -r '.selected_packages[0]' sel.json > pkg.txt
      - name: Compile only
        run: go test ${{ matrix.flags }} -run '^$' "$(cat pkg.txt)"
      - name: Test
        run: go test ${{ matrix.flags }} -json -count=1 -timeout=70m -run "$(cat pattern.txt)" "$(cat pkg.txt)" > test.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pertest-${{ matrix.partition }}${{ matrix.flags == '-race' && '-race' || '' }}
          path: test.json
