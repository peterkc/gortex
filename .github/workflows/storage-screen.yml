name: Storage harness tiny Linux checks
"on":
  push:
    branches: [study/storage-harness]
    paths:
      - study/storage/**
      - .github/workflows/storage-screen.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-harness-tiny-${{ github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOMAXPROCS: "2"
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "1"
jobs:
  tiny-linux:
    if: github.repository == 'peterkc/gortex' && github.ref == 'refs/heads/study/storage-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          cache: false
      - name: Bind source and isolated caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage/bin" "$RUNNER_TEMP/storage/tmp"
          echo "GOCACHE=$RUNNER_TEMP/storage/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/storage/go-mod" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/storage/tmp" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/storage/tmp" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/storage/home" "$RUNNER_TEMP/storage/config" \
            "$RUNNER_TEMP/storage/data" "$RUNNER_TEMP/storage/cache"
          echo "HOME=$RUNNER_TEMP/storage/home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/storage/config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/storage/data" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/storage/cache" >> "$GITHUB_ENV"
          echo "PYTHONDONTWRITEBYTECODE=1" >> "$GITHUB_ENV"
          python3.12 -c 'import os; from pathlib import Path; p = Path(os.environ["GITHUB_ENV"]); p.open("a").write("".join(k + "=\n" for k in os.environ if k.startswith(("PRIME_", "RLM_", "GORTEX_"))))'
          git ls-files study/storage .github/workflows/storage-screen.yml \
            | xargs sha256sum > "$RUNNER_TEMP/storage/ci-protected-before.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/storage/ci-source.txt"
          go version | tee -a "$RUNNER_TEMP/storage/ci-source.txt"
          sha256sum study/storage/pod/run.py study/storage/pod/test_driver.py \
            study/storage/onnx/main.go study/storage/onnx/main_test.go \
            | tee -a "$RUNNER_TEMP/storage/ci-source.txt"
      - name: Delegate test-only cgroup-v2 memory scopes
        shell: bash
        run: |
          set -euo pipefail
          root="/sys/fs/cgroup/gxstudy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -f /sys/fs/cgroup/cgroup.controllers
          echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          sudo mkdir "$root"
          echo +memory | sudo tee "$root/cgroup.subtree_control"
          sudo mkdir "$root/test-driver"
          sudo chown -R "$(id -u):$(id -g)" "$root"
          stat -c '%d %i' "$root" > "$RUNNER_TEMP/storage/cgroup-root.identity"
          echo "GXSTUDY_TEST_CGROUP_ROOT=$root" >> "$GITHUB_ENV"
      - name: Harness tests and vet, including actual hard-limit failures
        working-directory: study/storage/harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          # clone3's cgroup placement checks the source/target common ancestor.
          # Enter this job's delegated tree once; child moves then stay inside it.
          printf '%s\n' "$$" \
            | sudo tee "$GXSTUDY_TEST_CGROUP_ROOT/test-driver/cgroup.procs" > /dev/null
          expected="${GXSTUDY_TEST_CGROUP_ROOT#/sys/fs/cgroup}/test-driver"
          grep -Fx "0::$expected" "/proc/$$/cgroup" \
            | tee "$RUNNER_TEMP/storage/ci-cgroup.txt"
          go test -p=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/storage/ci-harness.txt"
          go vet -p=1 ./...
      - name: Build the independent tiny-fixture tools
        working-directory: study/storage/harness
        shell: bash
        run: |
          set -euo pipefail
          go build -p=1 -o "$RUNNER_TEMP/storage/bin/oracle" ./cmd/oracle
          go build -p=1 -o "$RUNNER_TEMP/storage/bin/gen" ./cmd/gen
      - name: Catalog callers and dispatch precedent inside the delegated tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          printf '%s\n' "$$" \
            | sudo tee "$GXSTUDY_TEST_CGROUP_ROOT/test-driver/cgroup.procs" > /dev/null
          expected="${GXSTUDY_TEST_CGROUP_ROOT#/sys/fs/cgroup}/test-driver"
          grep -Fx "0::$expected" "/proc/$$/cgroup" \
            | tee -a "$RUNNER_TEMP/storage/ci-cgroup.txt"
          go -C study/storage/adapters/catalog-refs test -p=1 -v ./... 2>&1 \
            | tee "$RUNNER_TEMP/storage/ci-catalog-refs.txt"
          go -C study/storage/adapters/catalog-bbolt test -p=1 -v ./... 2>&1 \
            | tee "$RUNNER_TEMP/storage/ci-catalog-bbolt.txt"
          go -C study/storage/adapters/catalog-manifest test -p=1 -v ./... 2>&1 \
            | tee "$RUNNER_TEMP/storage/ci-catalog-manifest.txt"
          go -C study/storage/adapters/catalog-pebble test -p=1 -v ./... 2>&1 \
            | tee "$RUNNER_TEMP/storage/ci-catalog-pebble.txt"
          go -C study/storage/adapters/catalog-sqlite test -p=1 -v ./... 2>&1 \
            | tee "$RUNNER_TEMP/storage/ci-catalog-sqlite.txt"
          go -C study/storage/adapters/catalog-refs build -p=1 \
            -o "$RUNNER_TEMP/storage/bin/catalog-refs" .
      - name: Streaming adapter callers on tiny native fixtures
        shell: bash
        run: |
          set -euo pipefail
          go -C study/storage/adapters/badger-bleve test -p=1 ./...
          go -C study/storage/adapters/badger-bleve vet -p=1 ./...
          go -C study/storage/adapters/bbolt-bleve test -p=1 ./...
          go -C study/storage/adapters/bbolt-bleve vet -p=1 ./...
          go -C study/storage/adapters/pebble-bleve test -p=1 ./...
          go -C study/storage/adapters/pebble-bleve vet -p=1 ./...
          go -C study/storage/adapters/sqlite-segment test -p=1 ./...
          go -C study/storage/adapters/sqlite-segment vet -p=1 ./...
          go -C study/storage/adapters/libsql-segment test -p=1 ./...
          go -C study/storage/adapters/libsql-segment vet -p=1 ./...
          go -C study/storage/vector/adapters/sqlite-vecflat test -p=1 ./...
          go -C study/storage/vector/adapters/sqlite-vecflat vet -p=1 ./...
      - name: Pinned USearch dependency and streaming caller fixtures
        shell: bash
        run: |
          set -euo pipefail
          # The existing script verifies its public source archive hash, builds
          # one static target with one worker, and writes only under isolated HOME.
          python3.12 study/storage/vector/scripts/build_usearch.py --execute
          native="$HOME/.prime/research/gortex/storage-architecture/tmp/native/usearch"
          export CGO_CFLAGS="-I$native"
          export CGO_LDFLAGS="-L$native -lstdc++ -lm -pthread"
          go -C study/storage/vector/adapters/sqlite-usearch test -p=1 ./...
          go -C study/storage/vector/adapters/sqlite-usearch vet -p=1 ./...
      - name: Probe tests, vet and Linux build without a model or runtime library
        working-directory: study/storage/onnx
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l main.go main_test.go)"
          go test -p=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/storage/ci-probe.txt"
          go vet -p=1 ./...
          go build -p=1 -o "$RUNNER_TEMP/storage/bin/onnxprobe" .
      - name: Actual controller and deadline rejection fixtures only
        working-directory: study/storage/pod
        shell: bash
        run: |
          set -euo pipefail
          # The Mac launcher is pinned to CPython 3.14.7 natively; CI matches
          # the minor version from the runner tool cache, with no download.
          py="$(ls -1 "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64/bin/python3.14 2>/dev/null | sort -V | tail -n 1 || true)"
          if test -z "$py"; then
            echo "FAIL: Python 3.14 absent from RUNNER_TOOL_CACHE; no download allowed"
            exit 1
          fi
          "$py" -c "import sys; assert sys.version_info[:2] == (3, 14)"
          "$py" --version | tee "$RUNNER_TEMP/storage/ci-driver.txt"
          "$py" -B -m unittest -v test_driver 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-driver.txt"
      - name: Hybrid vector controller fixtures only
        # Independent of the driver step; report it even after a failure.
        if: ${{ !cancelled() }}
        working-directory: study/storage/vector/hybrid-followup
        shell: bash
        run: |
          set -euo pipefail
          # The driver launches this controller with its own interpreter.
          py="$(ls -1 "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64/bin/python3.14 2>/dev/null | sort -V | tail -n 1 || true)"
          if test -z "$py"; then
            echo "FAIL: Python 3.14 absent from RUNNER_TOOL_CACHE; no download allowed"
            exit 1
          fi
          "$py" --version | tee "$RUNNER_TEMP/storage/ci-hybrid.txt"
          "$py" -B -m unittest -v test_controller 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-hybrid.txt"
      - name: Hybrid vector timing command tests without cgo
        # Independent of the driver step; report it even after a failure.
        if: ${{ !cancelled() }}
        working-directory: study/storage/vector/hybrid-followup
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd/timing)"
          go test -p=1 -v ./cmd/timing 2>&1 \
            | tee "$RUNNER_TEMP/storage/ci-hybrid-go.txt"
      - name: Exact evaluator entrypoint on tiny synthetic vectors only
        # Independent of the driver step; report it even after a failure.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          UV_PYTHON: python3.12
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/storage/python-env
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/storage/evaluator-tools"
          mkdir -p "$tools"
          curl --fail --location --max-time 90 --max-filesize 67108864 \
            https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz \
            -o "$tools/uv.tar.gz"
          echo "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f  $tools/uv.tar.gz" \
            | sha256sum --check -
          tar -xzf "$tools/uv.tar.gz" -C "$tools"
          export PATH="$tools/uv-x86_64-unknown-linux-gnu:$PATH"
          uv --version | tee "$RUNNER_TEMP/storage/ci-evaluator.txt"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/storage/evaluator-env"
          uv run --frozen --project study/storage/neon-eval python -m unittest discover \
            -s study/storage/neon-eval -p test_evaluate.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-evaluator.txt"
      - name: Accuracy bridge fixtures without model inference
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          UV_PYTHON: python3.12
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/storage/bridge-env
        run: |
          set -euo pipefail
          uv="$RUNNER_TEMP/storage/evaluator-tools/uv-x86_64-unknown-linux-gnu/uv"
          "$uv" run --frozen --project study/storage/pod-cost python -m unittest discover \
            -s study/storage/onnx -p test_accuracy_bridge.py -v 2>&1 \
            | tee "$RUNNER_TEMP/storage/ci-bridge.txt"
      - name: D3 inference contracts on tiny NumPy fixtures only
        # Independent of the driver step; report it even after a failure.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          UV_PYTHON: python3.12
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/storage/python-env
        run: |
          set -euo pipefail
          uv="$RUNNER_TEMP/storage/evaluator-tools/uv-x86_64-unknown-linux-gnu/uv"
          project="study/storage/pod-models"
          if test ! -f "$project/uv.lock"; then
            "$uv" lock --project "$project"
          fi
          "$uv" lock --check --project "$project"
          cp "$project/uv.lock" "$RUNNER_TEMP/storage/ci-models-lock.txt"
          "$uv" run --frozen --project "$project" python --version \
            | tee "$RUNNER_TEMP/storage/ci-models.txt"
          sha256sum "$project/pyproject.toml" "$project/uv.lock" \
            "$project/run_models.py" "$project/test_models.py" \
            study/storage/neon-eval/evaluate.py \
            | tee -a "$RUNNER_TEMP/storage/ci-models.txt"
          "$uv" run --frozen --project "$project" python -m unittest discover \
            -s "$project" -p test_models.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-models.txt"
      - name: Frozen-v8 tiny Linux fixtures without Gortex
        # Independent of the driver step; report it even after a failure.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3.12 --version | tee "$RUNNER_TEMP/storage/ci-v8.txt"
          python3.12 -m unittest discover -s study/storage/pod-v8 -p test_run.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-v8.txt"
      - name: CPU cost orchestration on tiny synthetic fixtures only
        # Independent of the driver step; report it even after a failure.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          UV_PYTHON: python3.12
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/storage/python-env
        run: |
          set -euo pipefail
          uv="$RUNNER_TEMP/storage/evaluator-tools/uv-x86_64-unknown-linux-gnu/uv"
          project="$RUNNER_TEMP/storage/cpu-cost-project"
          cp -R study/storage/pod-cost "$project"
          if test ! -f "$project/uv.lock"; then
            "$uv" lock --project "$project"
          fi
          "$uv" lock --check --project "$project"
          cp "$project/uv.lock" "$RUNNER_TEMP/storage/ci-cpu-cost-lock.txt"
          sha256sum "$project/pyproject.toml" "$project/uv.lock" \
            "$project/cpu_cost.py" "$project/test_cpu_cost.py" \
            | tee "$RUNNER_TEMP/storage/ci-cpu-cost.txt"
          "$uv" run --frozen --project "$project" python -m unittest discover \
            -s "$project" -p test_cpu_cost.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-cpu-cost.txt"
      - name: Hybrid vector job plans and helpers on tiny fixtures only
        # Independent of the driver step; report it even after a failure.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/storage/python-env
        run: |
          set -euo pipefail
          uv="$RUNNER_TEMP/storage/evaluator-tools/uv-x86_64-unknown-linux-gnu/uv"
          # Same interpreter family as the controller step: the driver's.
          py="$(ls -1 "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64/bin/python3.14 2>/dev/null | sort -V | tail -n 1 || true)"
          if test -z "$py"; then
            echo "FAIL: Python 3.14 absent from RUNNER_TOOL_CACHE; no download allowed"
            exit 1
          fi
          cd study/storage/vector/hybrid-followup
          if test ! -f uv.lock; then
            "$uv" lock --python "$py"
          fi
          "$uv" lock --check --python "$py"
          cp uv.lock "$RUNNER_TEMP/storage/ci-hybrid-followup-lock.txt"
          sha256sum pyproject.toml uv.lock run.py test_followup.py \
            | tee "$RUNNER_TEMP/storage/ci-hybrid-followup.txt"
          "$uv" run --frozen --python "$py" python -B -m unittest -v test_followup 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-hybrid-followup.txt"
      - name: Verify protected source and configuration stayed unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Tracked source/configuration changes:"
          git diff --name-status -- study/storage .github/workflows/storage-screen.yml \
            | tee "$RUNNER_TEMP/storage/ci-protected-diff.txt"
          echo "Untracked paths under study/storage:"
          git ls-files --others --exclude-standard -- study/storage \
            | tee "$RUNNER_TEMP/storage/ci-untracked.txt"
          echo "Ignored paths under study/storage:"
          git ls-files --others --ignored --exclude-standard -- study/storage \
            | tee "$RUNNER_TEMP/storage/ci-ignored.txt"
          sha256sum --check "$RUNNER_TEMP/storage/ci-protected-before.txt" \
            > "$RUNNER_TEMP/storage/ci-protected-after.txt"
          git diff --exit-code -- study/storage .github/workflows/storage-screen.yml
          test ! -s "$RUNNER_TEMP/storage/ci-untracked.txt"
          test ! -s "$RUNNER_TEMP/storage/ci-ignored.txt"
      - name: Release only this job's delegated cgroup parent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -n "${GXSTUDY_TEST_CGROUP_ROOT:-}"; then
            # This owner survives a test-parent failure. Preserve kernel evidence,
            # kill only the inode-checked job tree once, then wait on kernel events.
            sudo python3.12 -c '
          import json
          import os
          import select
          import stat
          import sys
          import time
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = Path("/sys/fs/cgroup") / (
              "gxstudy-" + sys.argv[3] + "-" + sys.argv[4]
          )
          identity = tuple(map(int, Path(sys.argv[2]).read_text().split()))
          info = root.lstat()
          if (root != expected or root.resolve() != root
                  or not stat.S_ISDIR(info.st_mode)):
              raise RuntimeError("refuse cleanup outside the exact job cgroup")
          if identity != (info.st_dev, info.st_ino):
              raise RuntimeError("refuse cleanup of a replaced job cgroup")
          relative = "/" + str(root.relative_to("/sys/fs/cgroup"))
          membership = Path("/proc/self/cgroup").read_text().splitlines()
          if any(line == "0::" + relative
                 or line.startswith("0::" + relative + "/") for line in membership):
              raise RuntimeError("cleanup process must be outside the target cgroup")


          def snapshot(phase):
              names = (
                  "cgroup.procs", "cgroup.events", "memory.max", "memory.swap.max",
                  "memory.oom.group", "memory.peak", "memory.events",
              )
              for current, _, _ in os.walk(root):
                  path = Path(current)
                  fields = {name: (path / name).read_text().strip() for name in names}
                  print(json.dumps({
                      "phase": phase, "scope": str(path.relative_to(root)),
                      "state": fields,
                  }), flush=True)


          snapshot("before-kill")
          fd = os.open(root / "cgroup.events", os.O_RDONLY | os.O_CLOEXEC)
          try:
              def state():
                  os.lseek(fd, 0, os.SEEK_SET)
                  return dict(line.split() for line in
                              os.read(fd, 4096).decode().splitlines())

              state()
              poll = select.poll()
              poll.register(fd, select.POLLPRI | select.POLLERR)
              (root / "cgroup.kill").write_text("1")
              deadline = time.monotonic() + 30
              while state()["populated"] != "0":
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise RuntimeError("job cgroup stayed populated after cgroup.kill")
                  poll.poll(max(1, int(remaining * 1000)))
          finally:
              os.close(fd)
          snapshot("after-kill")
          for current, _, _ in os.walk(root, topdown=False):
              path = Path(current)
              entry = path.lstat()
              if not stat.S_ISDIR(entry.st_mode) or entry.st_dev != info.st_dev:
                  raise RuntimeError("refuse cleanup of an unexpected cgroup entry")
              if path == root and (entry.st_dev, entry.st_ino) != identity:
                  raise RuntimeError("job cgroup changed before removal")
              path.rmdir()
          print(json.dumps({
              "phase": "removed", "root": str(root), "success": True,
          }), flush=True)
          ' "$GXSTUDY_TEST_CGROUP_ROOT" "$RUNNER_TEMP/storage/cgroup-root.identity" \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
              > "$RUNNER_TEMP/storage/ci-cgroup-cleanup.txt"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: storage-tiny-${{ github.sha }}
          path: ${{ runner.temp }}/storage/ci-*.txt
          if-no-files-found: error
