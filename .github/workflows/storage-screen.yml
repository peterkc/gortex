name: Storage harness tiny Linux checks
"on":
  push:
    branches: [study/storage-harness]
    paths:
      - study/storage/**
      - .github/workflows/storage-screen.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-harness-tiny-${{ github.ref }}
  cancel-in-progress: true
env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOMAXPROCS: "2"
  GOFLAGS: -mod=readonly
  CGO_ENABLED: "1"
jobs:
  tiny-linux:
    if: github.repository == 'peterkc/gortex' && github.ref == 'refs/heads/study/storage-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.1"
          cache: false
      - name: Bind source and isolated caches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/storage/bin" "$RUNNER_TEMP/storage/tmp"
          echo "GOCACHE=$RUNNER_TEMP/storage/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/storage/go-mod" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/storage/tmp" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/storage/tmp" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee "$RUNNER_TEMP/storage/ci-source.txt"
          go version | tee -a "$RUNNER_TEMP/storage/ci-source.txt"
          sha256sum study/storage/pod/run.py study/storage/pod/test_driver.py \
            study/storage/onnx/main.go study/storage/onnx/main_test.go \
            | tee -a "$RUNNER_TEMP/storage/ci-source.txt"
      - name: Build the independent tiny-fixture tools
        working-directory: study/storage/harness
        shell: bash
        run: |
          set -euo pipefail
          go build -p=1 -o "$RUNNER_TEMP/storage/bin/oracle" ./cmd/oracle
          go build -p=1 -o "$RUNNER_TEMP/storage/bin/gen" ./cmd/gen
      - name: Check and build the catalog dispatch precedent
        working-directory: study/storage/adapters/catalog-refs
        shell: bash
        run: |
          set -euo pipefail
          go test -p=1 ./...
          go build -p=1 -o "$RUNNER_TEMP/storage/bin/catalog-refs" .
      - name: Probe tests, vet and Linux build without a model or runtime library
        working-directory: study/storage/onnx
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l main.go main_test.go)"
          go test -p=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/storage/ci-probe.txt"
          go vet -p=1 ./...
          go build -p=1 -o "$RUNNER_TEMP/storage/bin/onnxprobe" .
      - name: Actual controller and deadline rejection fixtures only
        working-directory: study/storage/pod
        shell: bash
        run: |
          set -euo pipefail
          # The Mac launcher is pinned to CPython 3.14.7 natively; CI matches
          # the minor version from the runner tool cache, with no download.
          py="$(ls -1 "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64/bin/python3.14 2>/dev/null | sort -V | tail -n 1 || true)"
          if test -z "$py"; then
            echo "FAIL: Python 3.14 absent from RUNNER_TOOL_CACHE; no download allowed"
            exit 1
          fi
          "$py" -c "import sys; assert sys.version_info[:2] == (3, 14)"
          "$py" --version | tee "$RUNNER_TEMP/storage/ci-driver.txt"
          "$py" -B -m unittest -v test_driver 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-driver.txt"
      - name: Hybrid vector controller fixtures only
        working-directory: study/storage/vector/hybrid-followup
        shell: bash
        run: |
          set -euo pipefail
          # The driver launches this controller with its own interpreter.
          py="$(ls -1 "$RUNNER_TOOL_CACHE"/Python/3.14.*/x64/bin/python3.14 2>/dev/null | sort -V | tail -n 1 || true)"
          if test -z "$py"; then
            echo "FAIL: Python 3.14 absent from RUNNER_TOOL_CACHE; no download allowed"
            exit 1
          fi
          "$py" --version | tee "$RUNNER_TEMP/storage/ci-hybrid.txt"
          "$py" -B -m unittest -v test_controller 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-hybrid.txt"
      - name: Exact evaluator entrypoint on tiny synthetic vectors only
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          UV_PYTHON: python3.12
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/storage/evaluator-tools"
          layout="$RUNNER_TEMP/storage/evaluator-layout"
          project="research/gortex/storage-architecture/tmp/neon-eval"
          mkdir -p "$tools" "$layout/$(dirname "$project")"
          curl --fail --location --max-time 90 --max-filesize 67108864 \
            https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz \
            -o "$tools/uv.tar.gz"
          echo "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f  $tools/uv.tar.gz" \
            | sha256sum --check -
          tar -xzf "$tools/uv.tar.gz" -C "$tools"
          export PATH="$tools/uv-x86_64-unknown-linux-gnu:$PATH"
          uv --version | tee "$RUNNER_TEMP/storage/ci-evaluator.txt"
          cp -R study/storage/neon-eval "$layout/$project"
          cd "$layout"
          if test ! -f "$project/uv.lock"; then
            uv lock --project "$project"
          fi
          uv lock --check --project "$project"
          cp "$project/uv.lock" "$RUNNER_TEMP/storage/ci-evaluator-lock.txt"
          sha256sum "$project/pyproject.toml" "$project/uv.lock" \
            "$project/evaluate.py" "$project/test_evaluate.py" \
            | tee -a "$RUNNER_TEMP/storage/ci-evaluator.txt"
          uv run --project research/gortex/storage-architecture/tmp/neon-eval python -m unittest discover -s research/gortex/storage-architecture/tmp/neon-eval -p test_evaluate.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-evaluator.txt"
      - name: D3 inference contracts on tiny NumPy fixtures only
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          UV_PYTHON: python3.12
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
        run: |
          set -euo pipefail
          uv="$RUNNER_TEMP/storage/evaluator-tools/uv-x86_64-unknown-linux-gnu/uv"
          project="study/storage/pod-models"
          if test ! -f "$project/uv.lock"; then
            "$uv" lock --project "$project"
          fi
          "$uv" lock --check --project "$project"
          cp "$project/uv.lock" "$RUNNER_TEMP/storage/ci-models-lock.txt"
          "$uv" run --frozen --project "$project" python --version \
            | tee "$RUNNER_TEMP/storage/ci-models.txt"
          sha256sum "$project/pyproject.toml" "$project/uv.lock" \
            "$project/run_models.py" "$project/test_models.py" \
            study/storage/neon-eval/evaluate.py \
            | tee -a "$RUNNER_TEMP/storage/ci-models.txt"
          "$uv" run --frozen --project "$project" python -m unittest discover \
            -s "$project" -p test_models.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-models.txt"
      - name: Frozen-v8 tiny Linux fixtures without Gortex
        shell: bash
        run: |
          set -euo pipefail
          python3.12 --version | tee "$RUNNER_TEMP/storage/ci-v8.txt"
          python3.12 -m unittest discover -s study/storage/pod-v8 -p test_run.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-v8.txt"
      - name: CPU cost orchestration on tiny synthetic fixtures only
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          UV_PYTHON: python3.12
          UV_PYTHON_DOWNLOADS: never
          UV_CACHE_DIR: ${{ runner.temp }}/storage/uv-cache
        run: |
          set -euo pipefail
          uv="$RUNNER_TEMP/storage/evaluator-tools/uv-x86_64-unknown-linux-gnu/uv"
          project="$RUNNER_TEMP/storage/cpu-cost-project"
          cp -R study/storage/pod-cost "$project"
          if test ! -f "$project/uv.lock"; then
            "$uv" lock --project "$project"
          fi
          "$uv" lock --check --project "$project"
          cp "$project/uv.lock" "$RUNNER_TEMP/storage/ci-cpu-cost-lock.txt"
          sha256sum "$project/pyproject.toml" "$project/uv.lock" \
            "$project/cpu_cost.py" "$project/test_cpu_cost.py" \
            | tee "$RUNNER_TEMP/storage/ci-cpu-cost.txt"
          "$uv" run --frozen --project "$project" python -m unittest discover \
            -s "$project" -p test_cpu_cost.py -v 2>&1 \
            | tee -a "$RUNNER_TEMP/storage/ci-cpu-cost.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: storage-tiny-${{ github.sha }}
          path: ${{ runner.temp }}/storage/ci-*.txt
          if-no-files-found: error
