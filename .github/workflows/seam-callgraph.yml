name: Seam callgraph fixture tests (not study evidence)
"on":
  push:
    branches: [study/storage-harness]
    paths:
      - .github/workflows/seam-callgraph.yml
      - study/storage/seam/**
      - study/storage/harness/**
  workflow_dispatch:
concurrency:
  group: seam-callgraph-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  seam-callgraph:
    if: github.repository == 'peterkc/gortex' && github.ref == 'refs/heads/study/storage-harness'
    runs-on: ubuntu-24.04
    # Tested against CI_JOB_MINUTES; step budget comes from the same profiles.
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly -p=2
      GOMAXPROCS: "2"
      GOMEMLIMIT: 1536MiB
      CGO_ENABLED: "1"
      CGO_CFLAGS: -O2 -g -fno-strict-aliasing
      CGO_CXXFLAGS: -O2 -g -fno-strict-aliasing
      GOOS: linux
      GOARCH: amd64
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.27.3"
          cache: false
      - name: Prepare fixture-only diagnostics and coupled budgets
        id: budgets
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/seam-artifacts"
          printf '%s\n' 'CI fixture tests only; NOT FR-010/AC-011 evidence.' \
            'Full-source evidence: study/storage/seam/POD-RUNBOOK.md' \
            > "$RUNNER_TEMP/seam-artifacts/receipt.txt"
          python3.12 -B study/storage/seam/run_limited.py budgets >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$RUNNER_TEMP/seam-cache/build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/seam-cache/mod" >> "$GITHUB_ENV"
      - name: Preflight the fixed tiny-fixture profile
        run: |
          python3.12 -B study/storage/seam/run_limited.py preflight \
            --profile ci-fixture --output "$RUNNER_TEMP/seam-artifacts"
      - name: Filter and identity contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -B -m unittest discover -s study/storage/seam \
            -p test_filter_callgraph.py -v 2>&1 \
            | tee "$RUNNER_TEMP/seam-artifacts/filter-tests.txt"
      - name: Build the real checked-out native launcher
        working-directory: study/storage/harness
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/seam-artifacts/bin"
          go build -trimpath -p=1 \
            -o "$RUNNER_TEMP/seam-artifacts/bin/limited-command" ./cmd/limited-command
          sha256sum "$RUNNER_TEMP/seam-artifacts/bin/limited-command" \
            > "$RUNNER_TEMP/seam-artifacts/launcher.sha256"
      - name: Delegate a private cgroup tree, leaving the runner outside
        shell: bash
        run: |
          set -euo pipefail
          root="/sys/fs/cgroup/gxseam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -f /sys/fs/cgroup/cgroup.controllers
          echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          sudo mkdir "$root"
          echo +memory | sudo tee "$root/cgroup.subtree_control"
          sudo mkdir "$root/owner"
          sudo chown -R "$(id -u):$(id -g)" "$root"
          stat -c '%d %i' "$root" > "$RUNNER_TEMP/seam-artifacts/cgroup-root.identity"
          echo "GXSEAM_CGROUP_ROOT=$root" >> "$GITHUB_ENV"
      - name: Upload bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seam-fixture-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/seam-artifacts/*.txt
            ${{ runner.temp }}/seam-artifacts/host-capacity.json
            ${{ runner.temp }}/seam-artifacts/launcher.sha256
          if-no-files-found: warn
      - name: Real tiny CHA pipeline and contained OOM case
        timeout-minutes: ${{ fromJSON(steps.budgets.outputs.json).pipeline_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          fixture="$GITHUB_WORKSPACE/study/storage/seam/fixture"
          tree=$(python3.12 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fixture_sha256"])' "$fixture/symbols.json")
          go_binary=$(command -v go)
          printf '%s\n' "$$" | sudo tee "$GXSEAM_CGROUP_ROOT/owner/cgroup.procs" > /dev/null
          exec python3.12 -B study/storage/seam/run_pipeline.py \
            --profile ci-fixture --source "$fixture" \
            --artifact "$RUNNER_TEMP/seam-artifacts" \
            --launcher "$RUNNER_TEMP/seam-artifacts/bin/limited-command" \
            --root "$GXSEAM_CGROUP_ROOT" --go "$go_binary" \
            --commit "$GITHUB_SHA" --tree "$tree"
      - name: Compress full or explicitly partial raw evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/seam-artifacts/edges.tsv"
          if test -f "$raw"; then gzip -n "$raw"; fi
          if test -f "$raw.partial"; then gzip -n "$raw.partial"; fi
      - name: Release only the delegated seam root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/seam-artifacts/cgroup-root.identity"
          if test -f "$identity"; then
            sudo python3.12 -B study/storage/seam/run_limited.py cleanup \
              --root "$GXSEAM_CGROUP_ROOT" --identity "$identity" \
              --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
          fi
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seam-fixture-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seam-artifacts
          if-no-files-found: error
