# FORK-ONLY EXPERIMENT (peterkc/gortex). Never for upstream.
# Measures how often the recurring Windows test failures occur in isolation.
name: wip-flaky-baseline

on:
  push:
    branches: ['wip/ci/flaky']
  workflow_dispatch:

jobs:
  repeat:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            test: TestCheckoutStaleDiscoveryProofNeverReturnsBaseData
            pkg: ./internal/mcp/
          - os: windows-latest
            test: TestWorktreeAgentLifecycleSlowRefreshRemainsRecoverable
            pkg: ./internal/mcp/
          - os: windows-latest
            test: TestCheckoutMutationConcurrentAdmissionIsBoundedByCaller
            pkg: ./internal/indexer/
          - os: windows-latest
            test: TestNamedChildrenLinearScaling
            pkg: ./internal/semantic/tstypes/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Repeat the test
        shell: bash
        env:
          TEST: ${{ matrix.test }}
          PKG: ${{ matrix.pkg }}
        run: |
          set +e
          go test -v -count=20 -cpu=1,4 -timeout=40m -run "^${TEST}\$" "$PKG" > out.txt 2>&1
          rc=$?
          pass=$(grep -c -- "^--- PASS: ${TEST}" out.txt)
          fail=$(grep -c -- "^--- FAIL: ${TEST}" out.txt)
          echo "RESULT ${TEST} pass=${pass} fail=${fail} rc=${rc}" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -B2 -A12 -- "^--- FAIL: ${TEST}" out.txt | head -80
          exit 0
