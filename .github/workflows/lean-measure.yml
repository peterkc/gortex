name: Lean indexer measurement

on:
  push:
    branches: [measure/harness]
    paths: [measure/run.json]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CGO_ENABLED: "1"

jobs:
  config:
    if: github.repository == 'peterkc/gortex'
    runs-on: ubuntu-24.04
    outputs:
      commits: ${{ steps.run.outputs.commits }}
      binaries: ${{ steps.run.outputs.binaries }}
      check_binaries: ${{ steps.run.outputs.check_binaries }}
      repeats: ${{ steps.run.outputs.repeats }}
      sustained_io: ${{ steps.run.outputs.sustained_io }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read this run
        id: run
        run: |
          jq -e '
            (.commits | has("main") and has("pr806") and has("base")) and
            (.commits | keys - ["main", "pr806", "base", "trial", "e_control"] | length == 0) and
            (.commits | (has("e_control") | not) or has("trial")) and
            (.commits.main == "76c080e56da3547f2b464522fd6acbe0accaa25e") and
            (.commits.pr806 == "944cd9c125ad6ac4094986493d66c7703b2a0cc8") and
            (.commits.base == "9e9a842b2a023acc51ae5ba2cc7edf332160f128") and
            ([.commits[] | type == "string" and test("^[0-9a-f]{40}$")] | all) and
            (.workloads | sort == ["R-C2", "R-DE", "R-Fill", "R-Fresh", "R-Restart", "issue767-idle"]) and
            (.repeats | type == "number" and . == floor and . >= 1 and . <= 3) and
            (.sustained_io == false) and (.note | type == "string")
          ' measure/run.json
          {
            echo "commits=$(jq -c .commits measure/run.json)"
            echo "binaries=$(jq -c '.commits | if has("trial") then keys - ["main"] else keys end' measure/run.json)"
            echo "check_binaries=$(jq -c '.commits | keys - ["pr806"]' measure/run.json)"
            echo "repeats=$(jq -c '[range(0; .repeats)]' measure/run.json)"
            echo "sustained_io=$(jq -c .sustained_io measure/run.json)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert runner architecture and record machine
        env:
          LABEL: ${{ matrix.os }}
        run: |
          arch=$(uname -m)
          case "$LABEL:$arch" in
            ubuntu-24.04:x86_64|macos-15:arm64) ;;
            *) echo "Unexpected architecture: $LABEL:$arch" >&2; exit 1 ;;
          esac
          mkdir -p results
          jq -n --arg label "$LABEL" --arg arch "$arch" \
            --arg image "${ImageOS:-unknown}" --arg version "${ImageVersion:-unknown}" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_commit "$GITHUB_SHA" \
            '{label:$label, architecture:$arch, runner_image:$image, runner_image_version:$version,
              workflow_run_id:$run_id, run_commit:$run_commit}' > results/machine.json
          cp measure/run.json results/run.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.config.outputs.commits).main }}
          path: src-main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src-main/go.mod
      - name: Build main
        working-directory: src-main
        run: |
          test "$(git rev-parse HEAD)" = "$(jq -r .commits.main ../measure/run.json)"
          mkdir -p ../binaries
          go build -o ../binaries/main ./cmd/gortex
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.config.outputs.commits).pr806 }}
          path: src-pr806
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src-pr806/go.mod
      - name: Build pr806
        working-directory: src-pr806
        run: |
          test "$(git rev-parse HEAD)" = "$(jq -r .commits.pr806 ../measure/run.json)"
          mkdir -p ../binaries
          go build -o ../binaries/pr806 ./cmd/gortex
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.config.outputs.commits).base }}
          path: src-base
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src-base/go.mod
      - name: Build base
        working-directory: src-base
        run: |
          test "$(git rev-parse HEAD)" = "$(jq -r .commits.base ../measure/run.json)"
          mkdir -p ../binaries
          go build -o ../binaries/base ./cmd/gortex
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: fromJSON(needs.config.outputs.commits).trial != null
        with:
          ref: ${{ fromJSON(needs.config.outputs.commits).trial }}
          path: src-trial
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: fromJSON(needs.config.outputs.commits).trial != null
        with:
          go-version-file: src-trial/go.mod
      - name: Build trial
        if: fromJSON(needs.config.outputs.commits).trial != null
        working-directory: src-trial
        run: |
          test "$(git rev-parse HEAD)" = "$(jq -r .commits.trial ../measure/run.json)"
          mkdir -p ../binaries
          go build -o ../binaries/trial ./cmd/gortex
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: fromJSON(needs.config.outputs.commits).e_control != null
        with:
          ref: ${{ fromJSON(needs.config.outputs.commits).e_control }}
          path: src-e_control
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: fromJSON(needs.config.outputs.commits).e_control != null
        with:
          go-version-file: src-e_control/go.mod
      - name: Build e_control
        if: fromJSON(needs.config.outputs.commits).e_control != null
        working-directory: src-e_control
        run: |
          test "$(git rev-parse HEAD)" = "$(jq -r .commits.e_control ../measure/run.json)"
          mkdir -p ../binaries
          go build -o ../binaries/e_control ./cmd/gortex
      - name: Record binary identities
        run: |
          cp results/machine.json binaries/machine.json
          cp measure/run.json binaries/run.json
          for name in $(jq -r ' .commits | keys[]' measure/run.json); do
            hash=$(shasum -a 256 "binaries/$name" | cut -d ' ' -f 1)
            commit=$(jq -r --arg name "$name" '.commits[$name]' measure/run.json)
            jq -n --arg name "$name" --arg commit "$commit" --arg sha256 "$hash" \
              '{binary:$name, commit:$commit, sha256:$sha256}'
          done | jq -s . > binaries/identities.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.os }}
          path: binaries
          retention-days: 90

  workloads:
    needs: [config, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        repeat: ${{ fromJSON(needs.config.outputs.repeats) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-${{ matrix.os }}
          path: binaries
      - name: Assert runner architecture and record machine
        env:
          LABEL: ${{ matrix.os }}
        run: |
          arch=$(uname -m)
          case "$LABEL:$arch" in
            ubuntu-24.04:x86_64|macos-15:arm64) ;;
            *) echo "Unexpected architecture: $LABEL:$arch" >&2; exit 1 ;;
          esac
          mkdir -p results
          jq -n --arg label "$LABEL" --arg arch "$arch" \
            --arg image "${ImageOS:-unknown}" --arg version "${ImageVersion:-unknown}" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_commit "$GITHUB_SHA" \
            '{label:$label, architecture:$arch, runner_image:$image, runner_image_version:$version,
              workflow_run_id:$run_id, run_commit:$run_commit}' > results/machine.json
          cp measure/run.json results/run.json
      - name: Export corpus
        run: |
          mkdir corpus
          git archive 91a5c9514a9d41612183731f247ad46b03765abd | tar -x -C corpus
          git -C corpus init -b main
          git -C corpus -c user.name=Measurement -c user.email=measurement@example.invalid \
            -c commit.gpgsign=false add .
          git -C corpus -c user.name=Measurement -c user.email=measurement@example.invalid \
            -c commit.gpgsign=false commit -m corpus
      - name: Preflight sampler, then rotate binaries and run selected workloads
        env:
          REPEAT: ${{ matrix.repeat }}
          BINARIES: ${{ needs.config.outputs.binaries }}
        run: |
          while IFS='=' read -r key _value; do
            case "$key" in GORTEX_*|GX_*) unset "$key" ;; esac
          done < <(env)
          for name in $(jq -r '.commits | keys[]' measure/run.json); do chmod +x "binaries/$name"; done
          cp binaries/identities.json results/identities.json
          go test -tags acceptance -run '^TestProcessSamplerResources' -count=1 -v \
            -timeout=5m ./cmd/gortex | tee results/sampler.log
          # A skipped test or an empty -run match exits 0: require each named test.
          for test in FinalUsage Unavailable RunReport; do
            grep -Eq "^--- PASS: TestProcessSamplerResources${test} " results/sampler.log
          done
          go test -tags acceptance -run '^TestReconstructed(Measurement|Scorer$|SearchSymbols$)' -count=1 -v \
            ./cmd/gortex | tee results/measurement-tests.log
          for test in WarmupOrder Enrichment TerminalResult LoadNoReplay DemandOwner DemandGaps ContractAnswer JobEvidence ForcedPreparation ScorerErrors ScorerJobs RestartStarts PathSizes OversizedTerminal; do
            grep -Eq "^--- PASS: TestReconstructedMeasurement${test} " results/measurement-tests.log
          done
          status=0
          read -r -a names <<< "$(jq -r 'join(" ")' <<< "$BINARIES")"
          for ((offset=0; offset<${#names[@]}; offset++)); do
            name=${names[$(((REPEAT + offset) % ${#names[@]}))]}
            binary="$PWD/binaries/$name"
            actual=$(shasum -a 256 "$binary" | cut -d ' ' -f 1)
            test "$actual" = "$(jq -r --arg name "$name" '.[] | select(.binary == $name) | .sha256' binaries/identities.json)"
            echo "$name" >> results/order.txt
            while IFS= read -r workload; do
              case "$workload" in
                R-C2) test_name=TestReconstructedC2 ;;
                R-DE) test_name=TestReconstructedDE ;;
                R-Fill) test_name=TestReconstructedFill ;;
                R-Fresh) test_name=TestReconstructedFresh ;;
                R-Restart) test_name=TestReconstructedRestart ;;
                issue767-idle) test_name=TestIssue767IdleIOIntegration ;;
                *) echo "Unknown workload $workload" >&2; exit 1 ;;
              esac
              export GORTEX_RECON_TEST_BINARY="$binary" GORTEX_RECON_CORPUS="$PWD/corpus"
              export GORTEX_RECON_OUT="$PWD/results/$name.jsonl"
              export GORTEX_ISSUE767_TEST_BINARY="$binary"
              export GORTEX_ISSUE767_ARTIFACT_DIR="$PWD/results/$name/$workload"
              if ! go test -tags acceptance -run "^${test_name}$" -count=1 -v \
                -timeout=160m ./cmd/gortex | tee "results/$name-$workload.log"; then
                status=1
              fi
              if ! grep -Eq "^--- (PASS|FAIL): ${test_name} " "results/$name-$workload.log"; then
                echo "$test_name did not run for $name" >&2
                status=1
              fi
              # Fixture stores are about 1 GB each. Record their sizes, then drop
              # stores, corpus copies and the Go build cache; logs, JSON and JSONL
              # stay for upload.
              find "results/$name/$workload" -maxdepth 2 -name 'store.sqlite*' -type f \
                -exec stat -c '%n %s' {} + 2>/dev/null >> "results/$name/store-sizes.txt" ||
                find "results/$name/$workload" -maxdepth 2 -name 'store.sqlite*' -type f \
                  -exec stat -f '%N %z' {} + >> "results/$name/store-sizes.txt"
              find "results/$name/$workload" -maxdepth 2 \( -name 'store.sqlite*' -o -name repo -o -name 'linked*' \) \
                -prune -exec rm -rf {} +
              # A Go helper can outlive the daemon and still write here; a failed
              # cleanup only leaves files in the upload, so warn and continue.
              for cache in "results/$name/$workload"/*/cache/go-mod; do
                if [[ -d "$cache" ]]; then chmod -R u+w "$cache" || echo "warning: go-mod cache chmod incomplete for $name $workload" >&2; fi
              done
              rm -rf "results/$name/$workload"/*/cache/{go-build,go-mod} || echo "warning: Go cache cleanup incomplete for $name $workload" >&2
            done < <(jq -r '.workloads[]' measure/run.json)
          done
          exit "$status"
      - name: Upload raw measurements and fixture logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workloads-${{ matrix.os }}-${{ matrix.repeat }}
          path: results
          retention-days: 90

  sustained-io:
    needs: [config, build]
    if: needs.config.outputs.sustained_io == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        candidate: [pr806, trial]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-ubuntu-24.04
          path: binaries
      - name: Assert runner architecture and record machine
        env:
          LABEL: ${{ matrix.os }}
        run: |
          arch=$(uname -m)
          case "$LABEL:$arch" in
            ubuntu-24.04:x86_64|macos-15:arm64) ;;
            *) echo "Unexpected architecture: $LABEL:$arch" >&2; exit 1 ;;
          esac
          mkdir -p results
          jq -n --arg label "$LABEL" --arg arch "$arch" \
            --arg image "${ImageOS:-unknown}" --arg version "${ImageVersion:-unknown}" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_commit "$GITHUB_SHA" \
            '{label:$label, architecture:$arch, runner_image:$image, runner_image_version:$version,
              workflow_run_id:$run_id, run_commit:$run_commit}' > results/machine.json
          cp measure/run.json results/run.json
      - name: Paired sustained I/O driver
        env:
          CANDIDATE: ${{ matrix.candidate }}
        run: |
          while IFS='=' read -r key _value; do
            case "$key" in GORTEX_*|GX_*) unset "$key" ;; esac
          done < <(env)
          for name in $(jq -r '.commits | keys[]' measure/run.json); do chmod +x "binaries/$name"; done
          cp binaries/identities.json results/identities.json
          export GX_SUSTAINED_IO_BASELINE_BINARY="$PWD/binaries/main"
          export GX_SUSTAINED_IO_TEST_BINARY="$PWD/binaries/$CANDIDATE"
          export GX_SUSTAINED_IO_ARTIFACT_DIR="$PWD/results/sustained-io"
          export GORTEX_ISSUE767_ARTIFACT_DIR="$PWD/results/fixtures"
          go test -tags acceptance -run '^TestProcessSamplerResources' -count=1 -v \
            -timeout=5m ./cmd/gortex | tee results/sampler.log
          # A skipped test or an empty -run match exits 0: require each named test.
          for test in FinalUsage Unavailable RunReport; do
            grep -Eq "^--- PASS: TestProcessSamplerResources${test} " results/sampler.log
          done
          go test -tags acceptance -count=1 -timeout=170m -v ./cmd/gortex \
            -run '^TestSustainedIOSustainedWriteAmplification$' | tee results/sustained-io.log
          grep -Eq '^--- PASS: TestSustainedIOSustainedWriteAmplification ' results/sustained-io.log
      - name: Upload sustained I/O evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sustained-io-main-${{ matrix.candidate }}
          path: results
          retention-days: 90

  suite:
    needs: config
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        binary: ${{ fromJSON(needs.config.outputs.check_binaries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert runner architecture and record machine
        env:
          LABEL: ${{ matrix.os }}
        run: |
          arch=$(uname -m)
          case "$LABEL:$arch" in
            ubuntu-24.04:x86_64|macos-15:arm64) ;;
            *) echo "Unexpected architecture: $LABEL:$arch" >&2; exit 1 ;;
          esac
          mkdir -p results
          jq -n --arg label "$LABEL" --arg arch "$arch" \
            --arg image "${ImageOS:-unknown}" --arg version "${ImageVersion:-unknown}" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_commit "$GITHUB_SHA" \
            '{label:$label, architecture:$arch, runner_image:$image, runner_image_version:$version,
              workflow_run_id:$run_id, run_commit:$run_commit}' > results/machine.json
          cp measure/run.json results/run.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(needs.config.outputs.commits)[matrix.binary] }}
          path: source
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
      - name: Exact source identity
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$(jq -r --arg name "$BINARY" '.commits[$name]' measure/run.json)"
          git -C source rev-parse HEAD > results/commit.txt
      - name: Race suite (record both commits, compare below)
        working-directory: source
        run: |
          while IFS='=' read -r key _value; do
            case "$key" in GORTEX_*|GX_*) unset "$key" ;; esac
          done < <(env)
          set +e
          go test -race -timeout=45m -json ./... > ../results/race.jsonl 2> ../results/race.stderr
          status=$?
          echo "$status" > ../results/race.exit
          cat ../results/race.stderr
          exit 0
      - name: Vet (record both commits, compare below)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: source
        run: |
          while IFS='=' read -r key _value; do
            case "$key" in GORTEX_*|GX_*) unset "$key" ;; esac
          done < <(env)
          set +e
          go vet ./... > ../results/vet.log 2>&1
          status=$?
          echo "$status" > ../results/vet.exit
          cat ../results/vet.log
          exit 0
      - name: Lint with the CI pin (record both commits, compare below)
        if: matrix.os == 'ubuntu-24.04'
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          working-directory: source
          args: --timeout=10m --output.json.path=../results/lint.json
          skip-cache: true
      - name: Record lint outcome
        if: always() && matrix.os == 'ubuntu-24.04'
        env:
          OUTCOME: ${{ steps.lint.outcome }}
        run: echo "$OUTCOME" > results/lint.outcome
      - name: Upload exact-commit suite evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: suite-${{ matrix.os }}-${{ matrix.binary }}
          path: results
          retention-days: 90

  compare-checks:
    needs: [config, suite]
    if: always() && needs.config.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-*
          path: suites
      - name: List shared failures and reject candidate-only failures
        run: |
          mkdir results
          status=0
          commits='${{ needs.config.outputs.commits }}'
          arms=$(jq -r 'keys - ["pr806"] | .[]' <<< "$commits")
          for os in ubuntu-24.04 macos-15; do
            for arm in $arms; do
              dir="suites/suite-$os-$arm"
              test -s "$dir/commit.txt"
              test "$(cat "$dir/commit.txt")" = "$(jq -r --arg arm "$arm" '.[$arm]' <<< "$commits")"
              test -s "$dir/race.exit"
              jq -s -r '[.[] | select(.Action == "fail") | [.Package, (.Test // "<package>")] | @json] | unique[]' \
                "$dir/race.jsonl" | LC_ALL=C sort > "$dir/race.failures"
              if [[ "$(cat "$dir/race.exit")" != 0 && ! -s "$dir/race.failures" ]]; then
                echo "$os $arm: race suite failed without structured results" >&2
                exit 1
              fi
              if [[ "$os" != ubuntu-24.04 ]]; then continue; fi
              test -s "$dir/vet.exit"
              # Successful vet output is progress, not diagnostics. A failed
              # command without real diagnostics is a blocked check, not parity.
              : > "$dir/vet.failures"
              if [[ "$(cat "$dir/vet.exit")" != 0 ]]; then
                awk '!/^go: downloading / && !/^# / && NF' "$dir/vet.log" | LC_ALL=C sort > "$dir/vet.diagnostics"
                diagnostic='^(vet: )?[^:]+\.go:[0-9]+(:[0-9]+)?:'
                if ! grep -Eq "$diagnostic" "$dir/vet.diagnostics" || \
                  grep -Ev "$diagnostic|^[[:space:]]" "$dir/vet.diagnostics"; then
                  echo "$arm: vet infrastructure failure or missing diagnostics" >&2
                  exit 1
                fi
                # Identity excludes positions; full diagnostics remain available below.
                sed -E 's/^((vet: )?[^:]+\.go):[0-9]+(:[0-9]+)?:/\1:/' "$dir/vet.diagnostics" | LC_ALL=C sort -u > "$dir/vet.failures"
                cp "$dir/vet.diagnostics" "results/$os-$arm-vet-diagnostics.txt"
              fi
              jq -e 'has("Issues")' "$dir/lint.json"
              jq -r '.Issues // [] | .[] | [.Pos.Filename, .FromLinter, .Text] | @json' \
                "$dir/lint.json" | LC_ALL=C sort -u > "$dir/lint.failures"
              jq -r '.Issues // [] | .[] | [.FromLinter, .Pos.Filename, .Pos.Line, .Pos.Column, .Text] | @json' \
                "$dir/lint.json" > "results/$os-$arm-lint-diagnostics.txt"
              if [[ "$(cat "$dir/lint.outcome")" != success && ! -s "$dir/lint.failures" ]]; then exit 1; fi
            done
            for arm in $arms; do
              if [[ "$arm" == main ]]; then continue; fi
              control=base
              if [[ "$arm" == base ]]; then control=main; fi
              checks=race
              if [[ "$os" == ubuntu-24.04 ]]; then checks="race vet lint"; fi
              for check in $checks; do
                comm -12 "suites/suite-$os-$control/$check.failures" "suites/suite-$os-$arm/$check.failures" \
                  > "results/$os-$arm-shared-$check.txt"
                comm -13 "suites/suite-$os-$control/$check.failures" "suites/suite-$os-$arm/$check.failures" \
                  > "results/$os-$arm-new-$check.txt"
                if [[ "$arm" != base && -s "results/$os-$arm-new-$check.txt" ]]; then status=1; fi
              done
            done
          done
          for file in results/*.txt; do
            echo "### $file" >> "$GITHUB_STEP_SUMMARY"
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - name: Upload shared and new failure lists
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: check-comparison
          path: results
          retention-days: 90

  export:
    if: fromJSON(needs.config.outputs.commits).trial != null
    needs: [config, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries-ubuntu-24.04
          path: binaries
      - name: Assert runner architecture and record machine
        env:
          LABEL: ${{ matrix.os }}
        run: |
          arch=$(uname -m)
          case "$LABEL:$arch" in
            ubuntu-24.04:x86_64|macos-15:arm64) ;;
            *) echo "Unexpected architecture: $LABEL:$arch" >&2; exit 1 ;;
          esac
          mkdir -p results
          jq -n --arg label "$LABEL" --arg arch "$arch" \
            --arg image "${ImageOS:-unknown}" --arg version "${ImageVersion:-unknown}" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_commit "$GITHUB_SHA" \
            '{label:$label, architecture:$arch, runner_image:$image, runner_image_version:$version,
              workflow_run_id:$run_id, run_commit:$run_commit}' > results/machine.json
          cp measure/run.json results/run.json
      - name: Export corpus and compare cold graph exports in the private fixture
        run: |
          while IFS='=' read -r key _value; do
            case "$key" in GORTEX_*|GX_*) unset "$key" ;; esac
          done < <(env)
          chmod +x binaries/main binaries/trial binaries/base
          cp binaries/identities.json results/identities.json
          mkdir corpus
          git archive 91a5c9514a9d41612183731f247ad46b03765abd | tar -x -C corpus
          git -C corpus init -b main
          git -C corpus -c user.name=Measurement -c user.email=measurement@example.invalid add .
          git -C corpus -c user.name=Measurement -c user.email=measurement@example.invalid \
            -c commit.gpgsign=false commit -m corpus
          export GORTEX_RECON_EXPORT_MAIN_BINARY="$PWD/binaries/main"
          export GORTEX_RECON_EXPORT_CANDIDATE_BINARY="$PWD/binaries/trial"
          export GORTEX_RECON_EXPORT_PARENT_BINARY="$PWD/binaries/base"
          export GORTEX_RECON_CORPUS="$PWD/corpus"
          export GORTEX_RECON_EXPORT_OUT_DIR="$PWD/results"
          export GORTEX_ISSUE767_ARTIFACT_DIR="$PWD/results/fixtures"
          go test -tags acceptance -count=1 -v -timeout=110m ./cmd/gortex \
            -run '^TestReconstructedExport$' | tee results/export.log
          grep -Eq '^--- PASS: TestReconstructedExport ' results/export.log
          cat results/export-comparison.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw and sorted graph exports and daemon logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: graph-export
          path: results
          retention-days: 90
